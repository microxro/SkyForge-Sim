name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    container: swift:6.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Packages/SkyforgeKit/.build
          key: linux-spm-${{ hashFiles('Packages/SkyforgeKit/Package.resolved') }}
      - name: Build
        run: swift build --package-path Packages/SkyforgeKit 2>&1 | tee build.log
      - name: No warnings in our sources
        run: "! grep -E 'Packages/SkyforgeKit/(Sources|Tests)/.*warning:' build.log"
      - name: Test
        run: swift test --package-path Packages/SkyforgeKit
      - name: Soak memory (30 simulated minutes, run alone so resident memory is attributable)
        env:
          SKYFORGE_SOAK_MEMORY: "1"
        run: swift test --package-path Packages/SkyforgeKit --filter SoakTests
      - name: Project lint
        run: |
          apt-get update -qq && apt-get install -y -qq python3 >/dev/null
          python3 tools/lint_pbxproj.py
          python3 tools/check_licenses.py

  apple:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then sudo xcode-select -s /Applications/Xcode_26.6.app; fi
          xcodebuild -version
      - name: Metal toolchain (optional, shaders compile at runtime)
        run: xcodebuild -downloadComponent MetalToolchain || true
      - name: plutil lint
        run: plutil -lint SKYFORGE.xcodeproj/project.pbxproj App/Info.plist App/PrivacyInfo.xcprivacy App/SKYFORGE.entitlements
      - name: Package tests (macOS, incl. offscreen Metal regression when a device exists)
        env:
          SKYFORGE_VISUAL_OUT: ${{ github.workspace }}/visual-out
          SKYFORGE_VISUAL_LOG: "1"
        # Release build with testing enabled: real-airport loads (JPEG decode, mosaics) are CPU-heavy.
        # The full-HD review frames run in the `frames` job so this log stays readable.
        run: swift test -c release -Xswiftc -enable-testing --package-path Packages/SkyforgeKit --skip ShowcaseRenderTests
      - name: GPU frame time (run alone so no other test shares the GPU)
        env:
          SKYFORGE_FRAMETIME: "1"
        run: swift test -c release -Xswiftc -enable-testing --package-path Packages/SkyforgeKit --filter FrameTimeTests
      - name: Build iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project SKYFORGE.xcodeproj -scheme SKYFORGE -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tee ios-build.log | tail -n 80
      - name: Build macOS
        run: |
          set -o pipefail
          xcodebuild -project SKYFORGE.xcodeproj -scheme SKYFORGE -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build | tee mac-build.log | tail -n 80
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-build-logs
          path: "*-build.log"
          if-no-files-found: ignore
      - name: Upload visual regression output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression
          path: visual-out
          if-no-files-found: ignore

  # Art-review frames (five showcase airports and SkyWorld at 1280×720, Metal), logged as SKYFORGE_PNG
  # lines in their own job so they can be read back without the rest of the test output.
  frames:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        ident: [KMRY, KBFI, KASE, LSZS, NZQN, SKYWORLD]   # one job each: a job log carries a handful of frames
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then sudo xcode-select -s /Applications/Xcode_26.6.app; fi
      - name: Showcase frames
        env:
          SKYFORGE_VISUAL_LOG: "1"
          SKYFORGE_FRAMES: ${{ matrix.ident }}
        run: swift test -c release -Xswiftc -enable-testing --package-path Packages/SkyforgeKit --filter ShowcaseRenderTests
