name: CI

# SECURITY TODO: pin every `uses:` action (checkout, cache, upload-artifact) to a full commit SHA
# (`uses: owner/repo@<40-hex-sha> # v4`) so a moved tag cannot change what runs. SHAs must be looked up
# from the upstream repos; they are intentionally not guessed here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Runs on main get their own group (by run id). GitHub keeps only one pending run per group, so a shared group
  # let a newer push drop a queued run for an older commit. Branches still cancel superseded runs.
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Decides whether the macOS job (the scarce, queue-bound runner) is needed. Only pull requests that change
  # nothing but Markdown skip it; every other change runs all macOS checks. A skipped job counts as passing.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      apple: ${{ steps.decide.outputs.apple }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether macOS checks are needed
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "apple=true" >> "$GITHUB_OUTPUT"
            echo "Event $EVENT always runs macOS checks."
            exit 0
          fi
          git diff --name-only "$BASE" "$HEAD" > changed.txt
          # docs/perf_baseline.json is read by the macOS frame-time gate, so only *.md files skip macOS.
          if [ ! -s changed.txt ] || grep -Evq '\.md$' changed.txt; then
            echo "apple=true" >> "$GITHUB_OUTPUT"
            echo "Non-Markdown files changed; macOS checks run."
          else
            echo "apple=false" >> "$GITHUB_OUTPUT"
            echo "Markdown-only change; macOS checks skipped."
          fi

  linux:
    runs-on: ubuntu-24.04
    container: swift:6.3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: Packages/SkyforgeKit/.build
          key: linux-spm-${{ hashFiles('Packages/SkyforgeKit/Package.resolved') }}
          restore-keys: |
            linux-spm-
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          swift build --disable-automatic-resolution --package-path Packages/SkyforgeKit 2>&1 | tee build.log
      - name: No warnings in our sources
        run: "! grep -E 'Packages/SkyforgeKit/(Sources|Tests)/.*warning:' build.log"
      - name: Test
        run: swift test --disable-automatic-resolution --package-path Packages/SkyforgeKit
      - name: Soak memory (30 simulated minutes, run alone so resident memory is attributable)
        env:
          SKYFORGE_SOAK_MEMORY: "1"
        run: swift test --disable-automatic-resolution --package-path Packages/SkyforgeKit --filter SoakTests
      - name: Project lint
        run: |
          command -v python3 >/dev/null || { apt-get update -qq && apt-get install -y -qq python3 >/dev/null; }
          python3 tools/lint_pbxproj.py
          python3 tools/check_licenses.py
          python3 tools/region_packs/validate_regions.py
          python3 tools/appstore_preflight.py
          python3 tools/test_ci_frames.py

  apple:
    needs: changes
    if: ${{ needs.changes.outputs.apple == 'true' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then sudo xcode-select -s /Applications/Xcode_26.6.app; fi
          xcodebuild -version
      # Spike only (branch claude/scenery-background-assets-spike): print the BackgroundAssets SDK interface to the log.
      - name: Dump BackgroundAssets SDK interface
        continue-on-error: true
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          find "$SDK/System/Library/Frameworks/BackgroundAssets.framework" -name "*.swiftinterface" -print -exec cat {} \; | head -c 700000
          find "$SDK/System/Library/Frameworks/BackgroundAssets.framework" -name "*.swiftinterface" | wc -l
      # Caches are keyed on the Xcode build and the inputs that change the output. Restore keys fall back to the
      # newest cache for the same toolchain, so an edit only rebuilds what changed.
      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: Packages/SkyforgeKit/.build
          key: apple-spm-xcode26.6-${{ hashFiles('Packages/SkyforgeKit/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            apple-spm-xcode26.6-${{ hashFiles('Packages/SkyforgeKit/Package.resolved') }}-
      - name: Cache Xcode DerivedData
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: apple-dd-xcode26.6-${{ hashFiles('App/**', 'Packages/SkyforgeKit/Sources/**', 'SKYFORGE.xcodeproj/**') }}-${{ github.sha }}
          restore-keys: |
            apple-dd-xcode26.6-
      - name: Metal toolchain (optional, shaders compile at runtime)
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain || echo "::warning::Metal toolchain download failed (shaders compile at runtime)"
      - name: plutil lint
        run: plutil -lint SKYFORGE.xcodeproj/project.pbxproj App/Info.plist App/PrivacyInfo.xcprivacy App/SKYFORGE.entitlements
      - name: Package tests (macOS, incl. offscreen Metal regression when a device exists)
        env:
          SKYFORGE_VISUAL_OUT: ${{ github.workspace }}/visual-out
          SKYFORGE_VISUAL_LOG: "1"
        # Release build with testing enabled: real-airport loads (JPEG decode, mosaics) are CPU-heavy.
        # The full-HD review frames run in the Frames workflow so this log stays readable.
        run: swift test --disable-automatic-resolution -c release -Xswiftc -enable-testing --package-path Packages/SkyforgeKit --skip ShowcaseRenderTests
      - name: GPU frame time (run alone so no other test shares the GPU)
        env:
          SKYFORGE_FRAMETIME: "1"
        run: |
          set -o pipefail
          swift test --disable-automatic-resolution -c release -Xswiftc -enable-testing --package-path Packages/SkyforgeKit --filter FrameTimeTests | tee frametime.log
      - name: Frame-time gate (fails on regression against docs/perf_baseline.json)
        env:
          SKYFORGE_FRAMETIME: "1"
        run: |
          set -o pipefail
          if python3 tools/perf_gate.py frametime.log docs/perf_baseline.json; then
            exit 0
          fi
          # One slow run on the virtual runner is noise more often than a regression: measure again and
          # gate on the best median of both runs (a real regression stays slow in both).
          echo "::notice::frame-time gate failed once; re-measuring to rule out runner noise"
          swift test --disable-automatic-resolution -c release -Xswiftc -enable-testing --package-path Packages/SkyforgeKit --filter FrameTimeTests | tee frametime2.log
          python3 tools/perf_gate.py frametime.log frametime2.log docs/perf_baseline.json
      - name: Build iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project SKYFORGE.xcodeproj -scheme SKYFORGE -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tee ios-build.log | tail -n 80
      - name: Build macOS
        run: |
          set -o pipefail
          xcodebuild -project SKYFORGE.xcodeproj -scheme SKYFORGE -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build | tee mac-build.log | tail -n 80
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apple-build-logs
          path: "*-build.log"
          if-no-files-found: ignore
      - name: Upload visual regression output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression
          path: visual-out
          if-no-files-found: ignore
