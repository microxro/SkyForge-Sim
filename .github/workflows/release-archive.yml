name: Release archive

# Manual only. Builds Release archives for iOS and macOS.
# Unsigned by default (proves the archive builds). To sign and export for App Store Connect, set these
# repository secrets: APPLE_TEAM_ID, BUILD_CERTIFICATE_BASE64 (distribution .p12), P12_PASSWORD,
# ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_BASE64 (App Store Connect API .p8). Nothing is uploaded automatically.
on:
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign and export (needs the secrets above)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  archive:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, macos]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then sudo xcode-select -s /Applications/Xcode_26.6.app; fi
          xcodebuild -version
      - name: Static preflight
        run: python3 tools/appstore_preflight.py ${{ inputs.sign && '--release' || '' }}
      - name: Set build number
        run: echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Archive (unsigned)
        if: ${{ !inputs.sign }}
        run: |
          set -o pipefail
          DEST=$([ "${{ matrix.platform }}" = ios ] && echo 'generic/platform=iOS' || echo 'generic/platform=macOS')
          xcodebuild archive -project SKYFORGE.xcodeproj -scheme SKYFORGE -configuration Release \
            -destination "$DEST" -archivePath build/SKYFORGE-${{ matrix.platform }}.xcarchive \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" CODE_SIGNING_ALLOWED=NO | tail -n 60
      - name: Import certificate and API key
        if: ${{ inputs.sign }}
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          ASC_KEY: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"; KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC"
          security list-keychain -d user -s "$KC"
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$ASC_KEY" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
      - name: Archive and export (signed)
        if: ${{ inputs.sign }}
        run: |
          set -o pipefail
          DEST=$([ "${{ matrix.platform }}" = ios ] && echo 'generic/platform=iOS' || echo 'generic/platform=macOS')
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 -authenticationKeyID ${{ secrets.ASC_KEY_ID }} -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}"
          /usr/libexec/PlistBuddy -c "Set :teamID ${{ secrets.APPLE_TEAM_ID }}" tools/appstore/ExportOptions-macos.plist || true
          xcodebuild archive -project SKYFORGE.xcodeproj -scheme SKYFORGE -configuration Release \
            -destination "$DEST" -archivePath build/SKYFORGE-${{ matrix.platform }}.xcarchive \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" $AUTH | tail -n 60
          xcodebuild -exportArchive -archivePath build/SKYFORGE-${{ matrix.platform }}.xcarchive \
            -exportOptionsPlist tools/appstore/ExportOptions-${{ matrix.platform }}.plist \
            -exportPath build/export-${{ matrix.platform }} $AUTH | tail -n 30
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: skyforge-${{ matrix.platform }}-${{ inputs.sign && 'signed' || 'unsigned' }}
          path: |
            build/*.xcarchive
            build/export-*
          if-no-files-found: error
          retention-days: 7
