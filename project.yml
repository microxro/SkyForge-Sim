# XcodeGen FALLBACK spec (see docs/DECISIONS.md ADR-0004). The committed SKYFORGE.xcodeproj is the source of truth.
name: SKYFORGE
options:
  bundleIdPrefix: org.skyforge
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
packages:
  SkyforgeKit:
    path: Packages/SkyforgeKit
targets:
  SKYFORGE:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        excludes: ["Info.plist", "SKYFORGE.entitlements"]
    dependencies:
      - package: SkyforgeKit
        product: SkyforgeUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.skyforge.SKYFORGE
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/SKYFORGE.entitlements
